version: "3.9"

services:

  user-service:
    build: ./user-service
    ports:
      - "8001:3000"
    environment:
      DB_HOST: user-db
      DB_NAME: userdb
      DB_USER: postgres
      DB_PASS: postgres
    depends_on:
      - user-db

  user-db:
    image: postgres:16
    environment:
      POSTGRES_DB: userdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"

  user-db-admin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
